[package]
name = "asset-hub-kusama-emulated-chain"
authors.workspace = true
edition.workspace = true
version.workspace = true
license = "Apache-2.0"
description = "Asset Hub Kusama emulated chain used for integration tests"
publish = false

[dependencies]

# Substrate
codec = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-keyring = { workspace = true }
frame-support = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }

# Pallets
pallet-accumulate-and-forward = { workspace = true, default-features = true }
pallet-collator-selection = { workspace = true, default-features = true }

# Cumulus
assets-common = { workspace = true, default-features = true }
parachains-common = { workspace = true, default-features = true }
cumulus-primitives-core = { workspace = true, default-features = true }
emulated-integration-tests-common = { workspace = true }
xcm = { workspace = true, default-features = true }
xcm-builder = { workspace = true, default-features = true }
polkadot-parachain-primitives = { workspace = true }

# Runtimes
asset-hub-kusama-runtime = { workspace = true }
kusama-emulated-chain = { workspace = true }
penpal-emulated-chain = { workspace = true }
bridge-hub-polkadot-emulated-chain = { workspace = true }

[features]
runtime-benchmarks = [
	"asset-hub-kusama-runtime/runtime-benchmarks",
	"assets-common/runtime-benchmarks",
	"bridge-hub-polkadot-emulated-chain/runtime-benchmarks",
	"cumulus-primitives-core/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"kusama-emulated-chain/runtime-benchmarks",
	"pallet-accumulate-and-forward/runtime-benchmarks",
	"pallet-collator-selection/runtime-benchmarks",
	"parachains-common/runtime-benchmarks",
	"penpal-emulated-chain/runtime-benchmarks",
	"polkadot-parachain-primitives/runtime-benchmarks",
	"xcm-builder/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
