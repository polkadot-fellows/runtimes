[package]
authors.workspace = true
build = "build.rs"
description = "Polkadot People Parachain Runtime"
edition.workspace = true
license.workspace = true
name = "people-polkadot-runtime"
repository.workspace = true
version.workspace = true

[dependencies]
enumflags2 = { workspace = true }
serde = { optional = true, features = ["derive"], workspace = true }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
hex-literal = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde_json = { features = ["alloc"], workspace = true }

frame-benchmarking = { optional = true, workspace = true }
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
frame-try-runtime = { optional = true, workspace = true }
indiv-pallet-airdrop = { workspace = true }
indiv-pallet-chunks-manager = { workspace = true }
indiv-pallet-coinage = { workspace = true }
indiv-pallet-dummy-dim = { workspace = true }
indiv-pallet-game = { workspace = true }
indiv-pallet-honour = { workspace = true }
indiv-pallet-members = { workspace = true }
indiv-pallet-members-notifier = { workspace = true }
indiv-pallet-origin-restriction = { workspace = true }
indiv-pallet-people = { workspace = true }
indiv-pallet-people-lite = { workspace = true }
indiv-pallet-relay-randomness = { workspace = true }
indiv-pallet-resources = { workspace = true }
indiv-pallet-score = { workspace = true }
indiv-support = { workspace = true }
